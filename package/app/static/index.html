<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Expense Tracker</title>
    <link rel="icon" type="image/png" href="/static/img/icon.png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Expense Tracker">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0B0F19" media="(prefers-color-scheme: dark)">
    <script>
        // Apply the saved theme before the first paint to avoid a flash
        try {
            var theme = localStorage.getItem("theme");
            if (theme === "light" || theme === "dark") {
                document.documentElement.setAttribute("data-theme", theme);
                document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.content = theme === "dark" ? "#0B0F19" : "#EEF1F6"; });
            }
        } catch (e) { /* storage unavailable */ }
    </script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>

<body>
    <header class="navbar" id="navbar">
        <div class="nav-left">
            <button id="backBtn" class="circle-btn" data-i18n-aria-label="nav.back" hidden>
                <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg>
            </button>
        </div>
        <div class="nav-title" id="navTitle" aria-hidden="true"></div>
        <div class="nav-right">
            <button id="addBtn" class="circle-btn accent" data-i18n-aria-label="nav.add">
                <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
        </div>
    </header>

    <main class="content">
        <div class="page-head">
            <h1 class="large-title" id="viewTitle"></h1>
            <div id="monthSwitch" class="month">
                <button data-month-step="-1" data-i18n-aria-label="nav.prev_month"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></button>
                <span id="monthLabel"></span>
                <button data-month-step="1" data-i18n-aria-label="nav.next_month"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg></button>
            </div>
        </div>
        <div id="view"></div>
    </main>

    <nav class="tabbar" data-i18n-aria-label="nav.sections">
        <button class="tab" data-nav="home">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h13V9"/><path d="M10 20v-5h4v5"/></svg>
            <span class="tab-label" data-i18n="view.home"></span>
        </button>
        <button class="tab" data-nav="movements">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 6.5h11M8.5 12h11M8.5 17.5h11"/><circle cx="4.5" cy="6.5" r=".6"/><circle cx="4.5" cy="12" r=".6"/><circle cx="4.5" cy="17.5" r=".6"/></svg>
            <span class="tab-label" data-i18n="view.movements"></span>
            <span id="reviewBadge" class="badge" hidden></span>
        </button>
        <button class="tab" data-nav="plan">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20h17"/><path d="M6.5 16.5v-5M12 16.5V5.5M17.5 16.5v-8"/></svg>
            <span class="tab-label" data-i18n="view.plan_tab"></span>
        </button>
        <button class="tab" data-nav="budgets">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><path d="M12 12h.01"/></svg>
            <span class="tab-label" data-i18n="view.budgets"></span>
        </button>
        <button class="tab" data-nav="settings">
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
            <span class="tab-label" data-i18n="view.settings"></span>
        </button>
    </nav>

    <script src="/static/js/locales/en.js"></script>
    <script src="/static/js/locales/es.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/vendor/chart.umd.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
